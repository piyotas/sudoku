<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="数独">
<meta name="theme-color" content="#12161d">
<title>数独</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --line:#c9c2b4; --line-strong:#3d3a34;
  --fg:#2b2823; --given:#2b2823; --user:#2f6fd0; --note:#8c877c;
  --sel:#d9e6f8; --peer:#eae6dc; --same:#cfe0f6; --err:#d8443c; --errbg:#f7dedc;
  --btn:#ffffff; --btn-b:#cfc8ba; --accent:#2f6fd0; --muted:#7d776c;
  --cage:#8a7d63; --cagetxt:#6b5f47;
  --block:#413b33; --kclue:#f6f3ec; --kdiag:#8d8477;
  --shadow:0 2px 10px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark){
:root{
  --bg:#12161d; --panel:#1a2029; --line:#39414d; --line-strong:#8d98a8;
  --fg:#e6e9ee; --given:#e6e9ee; --user:#6fa8ff; --note:#7b8493;
  --sel:#2c3a51; --peer:#212934; --same:#31445f; --err:#ff6b6b; --errbg:#40222a;
  --btn:#222a35; --btn-b:#39414d; --accent:#6fa8ff; --muted:#8d98a8;
  --cage:#6d7889; --cagetxt:#98a3b5;
  --block:#04070b; --kclue:#dbe3ee; --kdiag:#5a6675;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer;}

/* ---- layout ---- */
#app{--bs:min(94vw, 58vh); display:flex; flex-direction:column; align-items:center;
     gap:calc(var(--bs)*.028); width:100%; height:100%; justify-content:center; padding:8px;}
#left,#right{display:flex;flex-direction:column;align-items:center;gap:calc(var(--bs)*.028);}
@media (orientation:portrait){ #left,#right{width:var(--bs);} }
@media (orientation:landscape){
  #app{--bs:min(58vw, 86vh); flex-direction:row; gap:calc(var(--bs)*.05); align-items:center;}
  #right{width:min(34vw,340px); gap:calc(var(--bs)*.04);}
}

/* ---- top bar ---- */
#bar{display:flex;align-items:center;justify-content:space-between;width:var(--bs);gap:8px;
     font-size:clamp(13px,calc(var(--bs)*.042),20px);}
#bar .stat{display:flex;gap:.9em;align-items:baseline;color:var(--muted);font-variant-numeric:tabular-nums;}
#bar .stat b{color:var(--fg);font-weight:600;}
#newBtn{background:var(--btn);border:1px solid var(--btn-b);border-radius:10px;
        padding:.42em .9em;font-size:1em;font-weight:600;box-shadow:var(--shadow);}
#newBtn:active{transform:translateY(1px);}

/* ---- board ---- */
#board{
  position:relative; --n:9; --nc:3;
  width:var(--bs); height:var(--bs); display:grid;
  grid-template-columns:repeat(var(--n),1fr); grid-template-rows:repeat(var(--n),1fr);
  background:var(--panel); border:3px solid var(--line-strong); border-radius:6px;
  box-shadow:var(--shadow); overflow:hidden;
}
/* キラー数独風ケージ（地獄モードのヒント）。盤面と同じ正方形に重ねるので
   viewBox 座標のまま書けば自動で拡大縮小される。クリックは透過。 */
#cages{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
#cages line{stroke:var(--cage);stroke-width:.38;stroke-dasharray:1.8 1.5;stroke-linecap:round;}
/* カックロの黒マスと、そこに入る2つのヒント */
.cell.block{background:var(--block);}
.cell.block.peer,.cell.block.sel{background:var(--block);}
#cages line.kdiag{stroke:var(--kdiag);stroke-width:.3;stroke-dasharray:none;}
#cages text.kclue{fill:var(--kclue);font-size:3.1px;font-weight:700;}
#cages text{fill:var(--cagetxt);font-size:1.7px;font-weight:700;
            font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;}
.cell{
  position:relative; display:flex; align-items:center; justify-content:center;
  border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  font-size:calc(var(--bs)/var(--n)*.62); line-height:1; font-weight:400;
  background:var(--panel); transition:background-color .08s;
}
/* 端の罫線は JS が付けるクラスで消す（盤面サイズが可変なため nth-child は使えない） */
.cell.lastc{border-right:none;}
.cell.lastr{border-bottom:none;}
.cell.br{border-right:3px solid var(--line-strong);}
.cell.bb{border-bottom:3px solid var(--line-strong);}
.cell.peer{background:var(--peer);}
.cell.same{background:var(--same);}
.cell.sel{background:var(--sel);}
.cell.given{color:var(--given);font-weight:700;}
.cell.user{color:var(--user);font-weight:600;}
.cell.err{color:var(--err)!important;background:var(--errbg);}
.cell .notes{
  position:absolute;inset:6%;display:grid;
  grid-template-columns:repeat(var(--nc),1fr);grid-auto-rows:1fr;
  font-size:calc(var(--bs)/var(--n)*.235);color:var(--note);font-weight:600;line-height:1;
}
.cell .notes span{display:flex;align-items:center;justify-content:center;}
/* 枠の数字が載るマスは、入力した数字とメモを合計値の下に逃がす（重なり防止）。
   .notes は絶対配置なので padding の影響を受けず、inset だけで位置が決まる。 */
/* ずらすのはラベルのあるマスだけで足りるが、それだと数字の高さが不揃いになるので
   枠を使うゲームでは盤面全体を同じだけ下げて揃える。 */
#board.haslabel .cell{padding-top:20%;}
.cell.hassum .notes{inset:34% 5% 4% 5%;font-size:calc(var(--bs)/var(--n)*.19);}

/* ---- number pad ---- */
#pad{display:grid;grid-template-columns:repeat(var(--pn),minmax(0,1fr));gap:calc(var(--bs)*.014);width:var(--bs);}
.num{
  aspect-ratio:1/1; max-height:clamp(54px,10vh,84px); min-width:0; min-height:0;
  background:var(--btn); border:1px solid var(--btn-b); border-radius:10px;
  font-size:min(calc(var(--bs)/var(--pn)*.56),42px); font-weight:600;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow); padding:0;
}
.num:active{background:var(--sel);}
.num.done{opacity:.3;}
@media (orientation:landscape){
  #pad{grid-template-columns:repeat(3,1fr);gap:8px;width:100%;}
  .num{aspect-ratio:auto; height:clamp(46px,9vh,76px); font-size:clamp(22px,4.4vh,40px);}
}

#tools{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--bs)*.02);width:var(--bs);}
.tool{
  background:var(--btn);border:1px solid var(--btn-b);border-radius:12px;box-shadow:var(--shadow);
  padding:.62em 0; font-size:clamp(13px,calc(var(--bs)*.045),19px); font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:.35em;
}
.tool:active{transform:translateY(1px);}
.tool.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.tool .tag{font-size:.72em;font-weight:700;opacity:.8;}
@media (orientation:landscape){ #tools{width:100%;gap:8px;} }

/* ---- overlays ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:20;padding:20px;}
.ov.show{display:flex;}
.card{background:var(--panel);border-radius:18px;padding:26px 24px;max-width:380px;width:100%;
      box-shadow:0 12px 40px rgba(0,0,0,.4);text-align:center;
      max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.card h2{margin:0 0 4px;font-size:22px;}
.card p{margin:6px 0 18px;color:var(--muted);font-size:15px;line-height:1.6;}
.card .big{font-size:34px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;margin:10px 0 4px;}
.dbtn{display:block;width:100%;background:var(--btn);border:1px solid var(--btn-b);border-radius:12px;
      padding:14px;margin-top:9px;font-size:17px;font-weight:600;}
.dbtn:active{transform:translateY(1px);}
.dbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.dbtn small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:3px;}
#gameTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:14px 0 4px;}
.gtab{background:var(--btn);border:1px solid var(--btn-b);border-radius:11px;
      padding:11px 1px;font-size:13px;font-weight:600;}
.gtab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
#spin{font-size:16px;color:#fff;text-align:center;}

/* ---- クリア演出 ---- */
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block;}
/* 花火が見えるよう、暗幕は少し遅れてから降ろす */
#ovWin{background:rgba(0,0,0,0);backdrop-filter:none;transition:background-color .8s ease;}
#ovWin.lit{background:rgba(0,0,0,.55);backdrop-filter:blur(3px);}
#ovWin .card{position:relative;}
#ovWin.fxon .card{animation:cardIn .55s cubic-bezier(.2,1.5,.4,1) .85s both;}
@keyframes cardIn{
  from{opacity:0;transform:translateY(28px) scale(.86);}
  to{opacity:1;transform:none;}
}
/* 盤面を左上から順に弾ませる */
@keyframes cellPop{
  0%{transform:scale(1);}
  40%{transform:scale(1.17);}
  100%{transform:scale(1);}
}
@keyframes boardGlow{
  0%{box-shadow:var(--shadow);}
  30%{box-shadow:0 0 0 4px rgba(255,196,64,.85), 0 0 34px 10px rgba(255,196,64,.5);}
  100%{box-shadow:var(--shadow);}
}
#board.win{animation:boardGlow 1.5s ease-out .35s both;}
@media (prefers-reduced-motion: reduce){
  #ovWin.fxon .card{animation:none;}
  #board.win{animation:none;}
}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="bar">
      <div class="stat"><span id="diffLbl">ふつう</span></div>
      <div class="stat"><span>ミス <b id="missLbl">0</b></span></div>
      <button id="newBtn">新規</button>
    </div>
    <div id="board"></div>
  </div>
  <div id="right">
    <div id="pad"></div>
    <div id="tools">
      <button class="tool" id="memoBtn">メモ <span class="tag">OFF</span></button>
      <button class="tool" id="eraseBtn">消去</button>
      <button class="tool" id="undoBtn">取り消し</button>
    </div>
  </div>
</div>

<div class="ov" id="ovNew"><div class="card">
  <h2>ゲームを選ぶ</h2>
  <div id="gameTabs">
    <button class="gtab on" data-g="n">数独</button>
    <button class="gtab" data-g="k">キラー</button>
    <button class="gtab" data-g="p">賢くなる</button>
    <button class="gtab" data-g="q">カックロ</button>
  </div>
  <p id="gameDesc"></p>
  <div id="diffList"></div>
  <button class="dbtn" id="cancelNew">もどる</button>
</div></div>

<div class="ov" id="ovWin"><div class="card">
  <h2>クリア！</h2>
  <div class="big" id="winDiff">ふつう</div>
  <p id="winSub">ミス 0</p>
  <button class="dbtn primary" id="againBtn">もう一局</button>
</div></div>

<div class="ov" id="ovGen"><div id="spin"><span id="genLbl">盤面を厳選中…</span></div></div>

<script>
'use strict';
/* c=目標ヒント数 / lo..hi=要求する手筋レベル（humanSolve の判定値） */
var DIFF=[
  {n:'やさしい',   c:45, lo:1, hi:1, d:'単数決めだけで解ける'},
  {n:'ふつう',     c:34, lo:1, hi:1, d:'手筋は基本のみ・ヒント34'},
  {n:'むずかしい', c:30, lo:2, hi:2, d:'中級技（同盟・偏り）が必要'},
  {n:'鬼',        c:27, lo:3, hi:3, d:'上級技（X-Wing / XY-Wing）が必要'},
  {n:'地獄',      c:24, lo:4, hi:4, cage:true, d:'読み切り勝負・ケージのヒント付き'}
];
/* キラーナンプレ：ヒント数字が無いぶん、難易度はケージの大きさと個数で決まる。
   maxS=1ケージの最大マス数 / merges=併合を試みる回数の上限 */
var KDIFF=[
  {n:'やさしい',   maxS:3, merges:10, d:'2〜3マスの小さなケージ中心'},
  {n:'ふつう',     maxS:4, merges:25, d:'最大4マス'},
  {n:'むずかしい', maxS:5, merges:45, d:'最大5マス・ケージが少なめ'},
  {n:'鬼',        maxS:6, merges:60, d:'最大6マス・ケージ数が最少'}
];
/* 賢くなるパズル：難易度＝盤面サイズ。maxS=枠の最大マス数 / mulRate=3マス以上の枠を×にする割合 */
var PDIFF=[
  {n:'やさしい',   sz:4, maxS:3, mul:0.25, d:'4×4・枠は3マスまで'},
  {n:'ふつう',     sz:5, maxS:4, mul:0.40, d:'5×5・枠は4マスまで'},
  {n:'むずかしい', sz:6, maxS:4, mul:0.50, d:'6×6・かけ算多め'},
  {n:'鬼',        sz:7, maxS:5, mul:0.55, d:'7×7・枠は5マスまで'}
];
/* カックロ：inner=白マス領域の一辺（盤面はその+1。0行0列がヒント置き場）
   density=最初に撒く黒マスの割合 / minR=白マスの下限割合 */
var QDIFF=[
  {n:'やさしい',   inner:5, den:0.14, minR:0.60, d:'6×6'},
  {n:'ふつう',     inner:6, den:0.14, minR:0.58, d:'7×7'},
  {n:'むずかしい', inner:7, den:0.14, minR:0.56, d:'8×8'},
  {n:'鬼',        inner:8, den:0.14, minR:0.50, d:'9×9'}
];
var GEN_BUDGET=6000;   /* 条件に合う盤面を探す上限時間(ms) */
var KEY='sudoku.save.v1';
function curDiffList(){
  if(!S) return DIFF;
  return S.game==='k' ? KDIFF : S.game==='p' ? PDIFF : S.game==='q' ? QDIFF : DIFF;
}

/* ===== 生成 ===== */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
function boxOf(i){return (((i/9)|0)/3|0)*3+(((i%9)/3)|0);}
function idx81(){var a=[];for(var i=0;i<81;i++)a.push(i);return a;}

function generateFull(){
  var g=new Array(81).fill(0),rows=new Array(9).fill(0),cols=new Array(9).fill(0),bx=new Array(9).fill(0);
  (function rec(k){
    if(k===81) return true;
    var r=(k/9)|0,c=k%9,b=boxOf(k),used=rows[r]|cols[c]|bx[b];
    var cand=shuffle([1,2,3,4,5,6,7,8,9].filter(function(v){return !(used&(1<<v));}));
    for(var t=0;t<cand.length;t++){
      var v=cand[t],m=1<<v;
      g[k]=v; rows[r]|=m; cols[c]|=m; bx[b]|=m;
      if(rec(k+1)) return true;
      g[k]=0; rows[r]&=~m; cols[c]&=~m; bx[b]&=~m;
    }
    return false;
  })(0);
  return g;
}

/* 解の個数（limit で打ち切り）。1 なら一意解 */
function countSolutions(g,limit){
  var rows=new Array(9).fill(0),cols=new Array(9).fill(0),bx=new Array(9).fill(0),i,v,m;
  for(i=0;i<81;i++){v=g[i]; if(v){m=1<<v; rows[(i/9)|0]|=m; cols[i%9]|=m; bx[boxOf(i)]|=m;}}
  var empties=[]; for(i=0;i<81;i++) if(!g[i]) empties.push(i);
  var count=0;
  (function rec(){
    var best=-1,bestUsed=0,bestCnt=10,k,used,cnt,v2;
    for(k=0;k<empties.length;k++){
      var e=empties[k];
      if(g[e]) continue;
      used=rows[(e/9)|0]|cols[e%9]|bx[boxOf(e)];
      cnt=0; for(v2=1;v2<=9;v2++) if(!(used&(1<<v2))) cnt++;
      if(cnt<bestCnt){bestCnt=cnt;best=e;bestUsed=used; if(!cnt) break;}
    }
    if(best===-1){count++;return;}
    if(!bestCnt) return;
    var r=(best/9)|0,c=best%9,b=boxOf(best);
    for(v2=1;v2<=9;v2++){
      var mm=1<<v2; if(bestUsed&mm) continue;
      g[best]=v2; rows[r]|=mm; cols[c]|=mm; bx[b]|=mm;
      rec();
      g[best]=0; rows[r]&=~mm; cols[c]&=~mm; bx[b]&=~mm;
      if(count>=limit) return;
    }
  })();
  return count;
}

/* 一意解を保ったままマスを消す（点対称パス → 自由パス） */
function makePuzzle(sol,target){
  var g=sol.slice(),clues=81,order=shuffle(idx81()),k,i,j,a,b,removed;
  for(k=0;k<order.length;k++){
    if(clues<=target) break;
    i=order[k]; if(!g[i]) continue;
    j=80-i; a=g[i]; b=g[j]; removed=(j===i||!b)?1:2;
    g[i]=0; g[j]=0;
    if(countSolutions(g.slice(),2)===1) clues-=removed; else {g[i]=a; g[j]=b;}
  }
  if(clues>target){
    order=shuffle(idx81());
    for(k=0;k<order.length;k++){
      if(clues<=target) break;
      i=order[k]; if(!g[i]) continue;
      a=g[i]; g[i]=0;
      if(countSolutions(g.slice(),2)===1) clues--; else g[i]=a;
    }
  }
  return g;
}

/* ===== 難易度格付け：人間の手筋をなぞるソルバー =====
   Lv1 基本   : 裸の単数・隠れた単数
   Lv2 中級   : ブロック内偏り(pointing/claiming)・裸の二国/三国同盟・隠れた二国同盟
   Lv3 上級   : X-Wing(井桁)・XY-Wing
   Lv4 読み切り: 上記すべてで詰む（連鎖読み・仮置きが必要）           */
var PMAT=new Uint8Array(81*81);
(function(){
  for(var i=0;i<81;i++) for(var j=0;j<81;j++)
    if(i!==j && ((((i/9)|0)===((j/9)|0)) || (i%9===j%9) || boxOf(i)===boxOf(j))) PMAT[i*81+j]=1;
})();
var PEERS=(function(){
  var p=[],i,j,a;
  for(i=0;i<81;i++){ a=[]; for(j=0;j<81;j++) if(PMAT[i*81+j]) a.push(j); p.push(a); }
  return p;
})();
function bc(x){var n=0;while(x){x&=x-1;n++;}return n;}
function lowDigit(x){for(var v=1;v<=9;v++) if(x&(1<<v)) return v;return 0;}
var COMB={};
function combos(n,k){
  var key=n+'_'+k; if(COMB[key]) return COMB[key];
  var res=[],cur=[];
  (function rec(s){
    if(cur.length===k){res.push(cur.slice());return;}
    for(var i=s;i<n;i++){cur.push(i);rec(i+1);cur.pop();}
  })(0);
  COMB[key]=res; return res;
}

function humanSolve(puzzle){
  var ALL=0x3FE, val=puzzle.slice(), cand=new Array(81).fill(0), i, k, maxLv=0;
  for(i=0;i<81;i++) cand[i]= val[i]?0:ALL;
  for(i=0;i<81;i++) if(val[i]){ var ps=PEERS[i]; for(k=0;k<ps.length;k++) cand[ps[k]] &= ~(1<<val[i]); }

  function assign(i,v){ val[i]=v; cand[i]=0; var ps=PEERS[i],t; for(t=0;t<ps.length;t++) cand[ps[t]] &= ~(1<<v); }
  function consistent(){ for(var i=0;i<81;i++) if(!val[i] && !cand[i]) return false; return true; }
  function filled(){ for(var i=0;i<81;i++) if(!val[i]) return false; return true; }

  /* Lv1: 裸の単数 */
  function nakedSingle(){
    var ch=false,i;
    for(i=0;i<81;i++) if(!val[i] && bc(cand[i])===1){ assign(i,lowDigit(cand[i])); ch=true; }
    return ch;
  }
  /* Lv1: 隠れた単数（ある数字がユニット内で1マスにしか入らない） */
  function hiddenSingle(){
    var ch=false,g,u,v,m,k,i,cnt,at,taken;
    for(g=0;g<27;g++){
      u=GROUPS[g];
      for(v=1;v<=9;v++){

/* ===== キラー数独風ケージ（地獄モードのヒント） =====
   空きマスだけを点線で囲み、左上に中身の合計を出す。

var CAGE_RATIO=0.5;          /* 空きマスのうちケージで覆う割合 */

  var r=(i/9)|0, c=i%9, a=[];

  if(c>0) a.push(i-1); if(c<8) a.push(i+1);

function buildCages(given,sol){

  var target=Math.round(empty.length*CAGE_RATIO), used={}, cages=[], covered=0;
  var seeds=shuffle(empty.slice()), s,k,t,j,size,cage,digits,opts,pick,sum;
  for(s=0;s<seeds.length && covered<target;s++){

    size=CAGE_MIN+((Math.random()*(CAGE_MAX-CAGE_MIN+1))|0);
    cage=[seeds[s]]; digits={}; digits[sol[seeds[s]]]=1; used[seeds[s]]=1;
    while(cage.length<size){
      opts=[];
      for(k=0;k<cage.length;k++){
        var nb=neighbors4(cage[k]);
        for(t=0;t<nb.length;t++){
          j=nb[t];
          if(used[j]||given[j]||digits[sol[j]]) continue;
          if(opts.indexOf(j)<0) opts.push(j);
        }

      if(!opts.length) break;
      pick=opts[(Math.random()*opts.length)|0];
      used[pick]=1; digits[sol[pick]]=1; cage.push(pick);

    cage.sort(function(a,b){return a-b;});
    sum=0; for(k=0;k<cage.length;k++) sum+=sol[cage[k]];

/* ===== キラーナンプレ =====

    cage=[seed]; digits={}; digits[sol[seed]]=1; used[seed]=1;
    while(cage.length<size){

        for(t=0;t<nb.length;t++){

          if(opts.indexOf(j)<0) opts.push(j);

/* 「大きさ L・合計 S」になる数字の組み合わせを全列挙して table 化（9bit 全部で512通りだけ） */
var COMBO={};
(function(){

    for(v=1;v<=9;v++) if(mask&(1<<(v-1))){ digs.push(v); s+=v; }

/* ケージの候補を絞る。合計 sum になる組み合わせのうち、各マスの候補と
   矛盾なく配れるものだけを残し、マスごとの許容ビットを返す。null は矛盾。
   割当の列挙が膨らんだ場合は「組み合わせの和集合」という緩い評価に落とす
   （緩い側に倒すので候補を消しすぎることはない）。 */
function cageFilter(cells,cand,sum){
  var L=cells.length, list=COMBO[L+'_'+sum];
  if(!list) return null;
  var allowed=new Array(L), any=false, ci, t;

    var digs=list[ci], usedD=0, asg=new Array(L), budget=400, hit=false;
    (function rec(k){
      if(budget<=0) return;
      if(k===L){ hit=true; any=true; for(var q=0;q<L;q++) allowed[q]|=(1<<asg[q]); return; }
      for(var d=0;d<L;d++){
        if(usedD&(1<<d)) continue;
        if(!(cand[cells[k]]&(1<<digs[d]))) continue;
        budget--; if(budget<=0) return;
        usedD|=(1<<d); asg[k]=digs[d];
        rec(k+1);
        usedD&=~(1<<d);
      }
    })(0);
    if(budget<=0){                       /* 打ち切ったら緩い評価にする */
      var um=0; for(t=0;t<L;t++) um|=(1<<digs[t]);

/* 合計制約つきソルバー（候補伝播つき）。解を limit まで数える。

function killerCount(cages,limit,budget,wantSolutions){
  var nC=cages.length, cellCage=new Int8Array(81), i,k;
  for(i=0;i<nC;i++) for(k=0;k<cages[i].c.length;k++) cellCage[cages[i].c[k]]=i;
  var count=0, nodes=0, over=false, found=[];

    dirty.fill(0);

    while(loop){
      loop=false;
      for(gi=0;gi<nC;gi++){
        if(!dirty[gi]) continue;
        dirty[gi]=0;
        g=cages[gi];
        allowed=cageFilter(g.c,cand,g.s);
        if(!allowed) return false;
        for(k=0;k<g.c.length;k++){
          nc=cand[g.c[k]]&allowed[k];
          if(!nc) return false;
          if(nc!==cand[g.c[k]]){ cand[g.c[k]]=nc; dirty[cellCage[g.c[k]]]=1; loop=true; }
        }
      }
      for(j=0;j<81;j++){                              /* 確定マスを行・列・ブロックから除去 */
        if(bc(cand[j])!==1) continue;
        m=cand[j]; ps=PEERS[j];
        for(k=0;k<ps.length;k++){

        unit=GROUPS[u];

          for(k=0;k<9;k++) if(cand[unit[k]]&m){ cnt++; at=unit[k]; }
          if(!cnt) return false;

        }

var KLAST={nodes:0};   /* 直前の探索ノード数（診断用） */

/* ===== 人間の理詰めチェッカー（キラー用・仮置きなし） =====
   ケージの組み合わせ絞り込み・単数・隠れ単数に加えて「45の法則」
   （行/列の連続まとまり＝合計45×本数、ブロック＝45）を使う。

      var acc=0, open=[], counted={}, x, cg2;
      for(k=0;k<rg.cells.length;k++){
        x=rg.cells[k]; gi=cellCage[x];
        if(counted[gi]!==undefined) continue;
        cg2=cages[gi];
        var whole=true;
        for(j=0;j<cg2.c.length;j++) if(!inR[cg2.c[j]]){ whole=false; break; }
        if(whole){ acc+=cg2.s; counted[gi]=1; }
      }
      for(k=0;k<rg.cells.length;k++){
        x=rg.cells[k]; gi=cellCage[x];
        if(counted[gi]) continue;                     /* 丸ごと入りは計上済み */
        var fv=fixedVal(x);
        if(fv) acc+=fv; else open.push(x);
      }
      if(open.length===0){ if(acc!==rg.sum) return false; continue; }
      if(open.length===1){
        var need=rg.sum-acc;
        if(need<1||need>9||!(cand[open[0]]&(1<<need))) return false;
        if(cand[open[0]]!==(1<<need)){ cand[open[0]]=1<<need; changed=true; }
      }

  return true;
}

/* 隣り合うケージの組を列挙する */
function cageAdjacentPairs(cages){
  var at={},i,k,t,seen={},pairs=[];
  for(i=0;i<cages.length;i++) for(k=0;k<cages[i].c.length;k++) at[cages[i].c[k]]=i;
  for(i=0;i<cages.length;i++) for(k=0;k<cages[i].c.length;k++){
    var nb=neighbors4(cages[i].c[k]);
    for(t=0;t<nb.length;t++){
      var j=at[nb[t]];
      if(j===i) continue;
      var key=Math.min(i,j)+'_'+Math.max(i,j);
      if(seen[key]) continue;
      seen[key]=1; pairs.push([Math.min(i,j),Math.max(i,j)]);

}

/* 小さいケージで一意解の土台を作り、一意性が壊れない併合だけを採用して大きくする。
   採用時は必ずソルバーが「解1通り」と断定した場合だけなので、結果は常に検証済み。 */
var KBUD=3000;      /* 1回の一意性判定に許すノード数 */
/* 少しずつ進められる生成器。step(ms) は ms ミリ秒だけ作業を進め、
   未完成なら null、完成したら結果を返す。UI を固めないための分割実行用。 */
function killerBuilder(maxS,maxMerge){
  var sol=null, arr=null, pairs=null, redir=null, p=0, merges=0, bases=0, phase='base';
  function root(x){ while(redir[x]!==x) x=redir[x]; return x; }
  return {
    label:function(){ return phase==='base' ? '土台を作成中… '+bases+'回目' : 'ケージを併合中… '+merges+'個'; },
    step:function(ms){
      var t0=Date.now();
      while(phase!=='done' && Date.now()-t0<ms){
        if(phase==='base'){
          bases++;
          var s=generateFull(), b=makeKillerCages(s,2,3);
          /* 一意解かつ「45の法則＋組み合わせ絞りの理詰めだけで解ける」土台のみ採用 */
          if(killerCount(b,2,KBUD)===1 && killerHumanSolves(b)){
            sol=s; arr=b.slice(); redir=[];
            for(var i=0;i<arr.length;i++) redir[i]=i;
            pairs=shuffle(cageAdjacentPairs(b));
            phase='merge';
          }
          continue;
        }
        if(p>=pairs.length||merges>=maxMerge){ phase='done'; break; }
        var a=root(pairs[p][0]), b2=root(pairs[p][1]); p++;
        if(a===b2||!arr[a]||!arr[b2]) continue;
        var A=arr[a], B=arr[b2];
        if(A.c.length+B.c.length>maxS) continue;
        var cells=A.c.concat(B.c), dup=false, ds={}, k;
        for(k=0;k<cells.length;k++){ if(ds[sol[cells[k]]]){dup=true;break;} ds[sol[cells[k]]]=1; }
        if(dup) continue;                     /* 同じケージに同じ数字は入れられない */
        var cand={c:cells.slice().sort(function(x,y){return x-y;}), s:A.s+B.s};
        var trial=[],j;
        for(j=0;j<arr.length;j++){
          if(!arr[j]||j===b2) continue;
          trial.push(j===a?cand:arr[j]);
        }
        /* 「解1通り」かつ「理詰めで解ける」ままの併合だけ採用する。
           これを外すと途中から仮置きが必要な盤面になり、体感は"クリア不能"になる */
        if(killerCount(trial,2,KBUD)===1 && killerHumanSolves(trial)){
          arr[a]=cand; arr[b2]=null; redir[b2]=a; merges++;
        }
      }
      if(phase!=='done') return null;
      var out=arr.filter(Boolean);
      out.sort(function(x,y){return x.c[0]-y.c[0];});
      return {sol:sol, cages:out, merges:merges, bases:bases};
    }
  };
}

/* ===== 賢くなるパズル（KenKen） =====
   ルールは数独と別物：3×3ブロックは無く行と列だけ（ラテン方陣）、
   枠内に同じ数字が入ってよい、枠は ＋−×÷ の4種類、盤面は4×4〜7×7。 */
function idxN(m){ var a=[],i; for(i=0;i<m;i++) a.push(i); return a; }
function neighbors4N(i,n){
  var r=(i/n)|0, c=i%n, a=[];
  if(r>0) a.push(i-n); if(r<n-1) a.push(i+n);
  if(c>0) a.push(i-1); if(c<n-1) a.push(i+1);
  return a;
}
/* ラテン方陣（各行・各列に1〜n が1回ずつ） */
function latinSquare(n){
  var g=new Array(n*n).fill(0), rows=new Array(n).fill(0), cols=new Array(n).fill(0);
  (function rec(k){
    if(k===n*n) return true;
    var r=(k/n)|0, c=k%n, used=rows[r]|cols[c], cand=[],v;
    for(v=1;v<=n;v++) if(!(used&(1<<v))) cand.push(v);
    shuffle(cand);
    for(var t=0;t<cand.length;t++){
      var m=1<<cand[t];
      g[k]=cand[t]; rows[r]|=m; cols[c]|=m;
      if(rec(k+1)) return true;
      g[k]=0; rows[r]&=~m; cols[c]&=~m;
    }
    return false;
  })(0);
  return g;
}

/* 枠の計算判定。vals は枠に入っている数字（順不同） */
function opMatches(op,target,vals){
  var i,s,p;
  if(op==='='){ return vals[0]===target; }
  if(op==='+'){ s=0; for(i=0;i<vals.length;i++) s+=vals[i]; return s===target; }
  if(op==='*'){ p=1; for(i=0;i<vals.length;i++) p*=vals[i]; return p===target; }
  var a=Math.max(vals[0],vals[1]), b=Math.min(vals[0],vals[1]);
  if(op==='-') return a-b===target;
  return b!==0 && a%b===0 && a/b===target;
}
/* 途中の時点で「もう成立しえない」か（反則の即時表示用・保守的に判定） */
function opOverrun(op,target,vals){
  var i,s,p;
  if(op==='+'){ s=0; for(i=0;i<vals.length;i++) s+=vals[i]; return s>target; }
  if(op==='*'){ p=1; for(i=0;i<vals.length;i++) p*=vals[i]; return p>target; }
  return false;
}
/* 探索中の枝刈り：残り left マスで target に届く可能性があるか */
function opFeasible(op,target,vals,left,n){
  var i,s,p;
  if(op==='+'){
    s=0; for(i=0;i<vals.length;i++) s+=vals[i];
    return s+left<=target && s+left*n>=target;
  }
  if(op==='*'){
    p=1; for(i=0;i<vals.length;i++) p*=vals[i];
    if(p>target||target%p!==0) return false;
    return (target/p)<=Math.pow(n,left);
  }
  return true;                       /* −と÷ は2マス枠なので完成時に確定判定 */
}

/* 合計/積の制約つきソルバー。解を limit まで数える。-1 は探索打ち切り。 */
function kkCount(n,cages,limit,budget){
  var NN=n*n, cellCage=new Int8Array(NN), order=[], i,k;
  var cg=cages.slice().sort(function(a,b){return a.c[0]-b.c[0];});
  for(i=0;i<cg.length;i++) for(k=0;k<cg[i].c.length;k++){ cellCage[cg[i].c[k]]=i; order.push(cg[i].c[k]); }
  /* 枠が盤面をちょうど覆っていなければ不正な問題として弾く */
  if(order.length!==NN) return -2;
  var rows=new Array(n).fill(0), cols=new Array(n).fill(0);
  var cVals=[], cLeft=[];
  for(i=0;i<cg.length;i++){ cVals.push([]); cLeft.push(cg[i].c.length); }
  var count=0, nodes=0, over=false;

    if(over) return;

    if(p===NN){ count++; return; }
    var cell=order[p], r=(cell/n)|0, c=cell%n, gi=cellCage[cell], g=cg[gi];
    var blocked=rows[r]|cols[c], v,m,ok;

      cVals[gi].push(v); cLeft[gi]--;
      ok = cLeft[gi]===0 ? opMatches(g.op,g.v,cVals[gi])

      if(ok){
        rows[r]|=m; cols[c]|=m;
        rec(p+1);
        rows[r]&=~m; cols[c]&=~m;

/* 盤面を枠に分割する（枠内の数字の重複は許される） */
function kkPartition(n,maxS){
  var NN=n*n, order=shuffle(idxN(NN)), used={}, cages=[], s,k,t,j,seed,cage,opts,pick,size;
  for(s=0;s<order.length;s++){
    seed=order[s];
    if(used[seed]) continue;
    /* 2〜3マスを厚めに、たまに1マスと最大サイズ */
    size=Math.random()<0.08?1:(2+((Math.random()*(maxS-1))|0));
    if(size>maxS) size=maxS;
    cage=[seed]; used[seed]=1;
    while(cage.length<size){
      opts=[];
      for(k=0;k<cage.length;k++){
        var nb=neighbors4N(cage[k],n);
        for(t=0;t<nb.length;t++){ j=nb[t]; if(!used[j]&&opts.indexOf(j)<0) opts.push(j); }
      }
      if(!opts.length) break;
      pick=opts[(Math.random()*opts.length)|0];
      used[pick]=1; cage.push(pick);
    }
    cage.sort(function(a,b){return a-b;});
    cages.push(cage);
  }
  /* 1マス枠は答えがそのまま出てしまうので、隣の枠に吸収して keep 個までに減らす */
  var at={},i;
  for(i=0;i<cages.length;i++) for(k=0;k<cages[i].length;k++) at[cages[i][k]]=i;
  var singles=shuffle(cages.map(function(c,ix){return c.length===1?ix:-1;}).filter(function(x){return x>=0;}));
  var keep=Math.random()<0.5?1:0;
  var moved=0;
  for(s=0;s<singles.length&&moved<singles.length-keep;s++){
    var si=singles[s];
    /* 吸収先になって2マス以上に育った枠は、もう1マス枠ではないので触らない */
    if(!cages[si]||cages[si].length!==1) continue;
    var cell=cages[si][0], nb=shuffle(neighbors4N(cell,n));
    for(k=0;k<nb.length;k++){
      var gi=at[nb[k]];
      if(gi===si||!cages[gi]||cages[gi].length>=maxS) continue;
      cages[gi].push(cell);
      cages[gi].sort(function(a,b){return a-b;});
      at[cell]=gi; cages[si]=null; moved++;
      break;
    }

}
/* 各枠に演算子と目標値を割り当てる。3マス以上は ＋ か × のみ（本式のルール） */
function kkAssignOps(cages,sol,mulRate){
  var out=[],i,k;
  for(i=0;i<cages.length;i++){
    var cells=cages[i], vals=[],s=0,p=1;
    for(k=0;k<cells.length;k++){ vals.push(sol[cells[k]]); s+=sol[cells[k]]; p*=sol[cells[k]]; }
    if(cells.length===1){ out.push({c:cells,op:'=',v:vals[0]}); continue; }
    if(cells.length===2){
      var a=Math.max(vals[0],vals[1]), b=Math.min(vals[0],vals[1]), cand=[];
      cand.push({op:'+',v:a+b});
      cand.push({op:'*',v:a*b});
      if(a!==b) cand.push({op:'-',v:a-b});        /* 差が0の枠は作らない */
      if(a%b===0) cand.push({op:'/',v:a/b});
      var pick=cand[(Math.random()*cand.length)|0];
      out.push({c:cells,op:pick.op,v:pick.v}); continue;
    }
    out.push(Math.random()<mulRate?{c:cells,op:'*',v:p}:{c:cells,op:'+',v:s});
  }
  return out;
}

/* 少しずつ進める生成器。同じ分割に対して演算子の割り当てを何度か振り直し、
   駄目なら分割ごと作り直す。採用はソルバーが「解1通り」と断定したときだけ。 */
var KKBUD=400000;
function kkBuilder(n,maxS,mulRate){
  var tries=0;
  return {
    label:function(){ return '盤面を厳選中… '+tries+'回目'; },
    step:function(ms){
      var t0=Date.now();
      while(Date.now()-t0<ms){
        var sol=latinSquare(n), part=kkPartition(n,maxS);
        for(var a=0;a<6;a++){
          tries++;
          var cages=kkAssignOps(part,sol,mulRate);
          if(kkCount(n,cages,2,KKBUD)===1)
            return {n:n, sol:sol, cages:cages, tries:tries};
          if(Date.now()-t0>=ms) break;
        }
      }
      return null;
    }
  };
}

/* ===== カックロ =====
   黒マスに横（右上）と縦（左下）のヒント。白マスの連続＝1つの「枠」で、
   枠の合計がヒント、枠内に同じ数字は入らない。行・列全体やブロックの制約は無い。 */

/* 連続する白マスの並びを列挙（長さ2〜9でなければ不正な盤面） */
function kakuroRuns(n,block){
  var runs=[],r,c,i,cur;
  for(r=0;r<n;r++){
    cur=[];
    for(c=0;c<n;c++){ i=r*n+c;
      if(block[i]){ if(cur.length) runs.push({d:'h',c:cur}); cur=[]; } else cur.push(i); }
    if(cur.length) runs.push({d:'h',c:cur});
  }
  for(c=0;c<n;c++){
    cur=[];
    for(r=0;r<n;r++){ i=r*n+c;
      if(block[i]){ if(cur.length) runs.push({d:'v',c:cur}); cur=[]; } else cur.push(i); }
    if(cur.length) runs.push({d:'v',c:cur});
  }
  return runs;
}
/* 長さ1の枠（答えが丸見え）と長さ10以上の枠（数字が足りない）を黒マスで潰す */
function kakuroFixRuns(N,block){
  for(var k=0;k<40;k++){
    var rs=kakuroRuns(N,block), fixed=false;
    for(var q=0;q<rs.length;q++){
      var L=rs[q].c.length;
      if(L===1){ block[rs[q].c[0]]=true; fixed=true; }
      else if(L>9){ block[rs[q].c[(L/2)|0]]=true; fixed=true; }
    }
    if(!fixed) return true;
  }
  return false;
}
/* 各行・各列で数字が重複しない n×n の土台（数字は1〜9から選ぶ）。
   こうしておくと「どこを黒マスにしても枠内は自動的に重複なし」になり、
   黒マスを自由に足して制約を強められる。 */
function distinctGrid(n){
  var g=new Array(n*n).fill(0), rows=new Array(n).fill(0), cols=new Array(n).fill(0), steps=0;
  var ok=(function rec(k){
    if(++steps>400000) return false;
    if(k===n*n) return true;
    var r=(k/n)|0, c=k%n, used=rows[r]|cols[c], cand=[],v;
    for(v=1;v<=9;v++) if(!(used&(1<<v))) cand.push(v);
    shuffle(cand);
    for(var t=0;t<cand.length;t++){
      var m=1<<cand[t];
      g[k]=cand[t]; rows[r]|=m; cols[c]|=m;
      if(rec(k+1)) return true;
      g[k]=0; rows[r]&=~m; cols[c]&=~m;
    }
    return false;
  })(0);
  return ok?g:null;
}

/* 枠の候補を絞る。cageFilter と同じ発想だが「必ず使う数字」も返す。
   カックロでは数字が必ず出るとは限らないので、隠れ単数はこの required でのみ成立する。 */
function runFilter(cells,cand,sum){
  var L=cells.length, list=COMBO[L+'_'+sum];
  if(!list) return null;
  var allowed=new Array(L).fill(0), required=0x3FE, any=false, ci, t;
  for(ci=0;ci<list.length;ci++){
    var digs=list[ci], usedD=0, asg=new Array(L), budget=400, hit=false;
    (function rec(k){

      if(k===L){ hit=true; for(var q=0;q<L;q++) allowed[q]|=(1<<asg[q]); return; }
      for(var d=0;d<L;d++){
        if(usedD&(1<<d)) continue;
        if(!(cand[cells[k]]&(1<<digs[d]))) continue;
        budget--; if(budget<=0) return;
        usedD|=(1<<d); asg[k]=digs[d];
        rec(k+1);
        usedD&=~(1<<d);
      }
    })(0);
    if(budget<=0){                       /* 打ち切ったら緩い評価（候補を消しすぎない側に倒す） */
      var um=0; for(t=0;t<L;t++) um|=(1<<digs[t]);
      for(t=0;t<L;t++) allowed[t]|=um;
      hit=true;
    }
    if(hit){ any=true; var mm=0; for(t=0;t<L;t++) mm|=(1<<digs[t]); required&=mm; }

/* カックロのソルバー。logicOnly なら仮置きせず理詰めで解けるかだけを見る。 */
function kakuroSolve(n,block,runs,limit,budget,want){
  var NN=n*n, i, k, found=[], unresolved=null;
  var memberOf=[]; for(i=0;i<NN;i++) memberOf.push([]);
  runs.forEach(function(rn,ix){ rn.c.forEach(function(x){ memberOf[x].push(ix); }); });
  var peers=[];
  for(i=0;i<NN;i++){
    var set={}, lst=[];
    memberOf[i].forEach(function(ix){ runs[ix].c.forEach(function(x){ if(x!==i&&!set[x]){set[x]=1;lst.push(x);} }); });

  }
  var count=0, nodes=0, over=false, logicNodes=0;

  function propagate(cand){
    var loop=true, ix, rn, f, nc, m, j, v, cnt, at, t;
    while(loop){
      loop=false;
      for(ix=0;ix<runs.length;ix++){
        rn=runs[ix];
        f=runFilter(rn.c,cand,rn.s);
        if(!f) return false;
        for(k=0;k<rn.c.length;k++){
          nc=cand[rn.c[k]]&f.allowed[k];
          if(!nc) return false;
          if(nc!==cand[rn.c[k]]){ cand[rn.c[k]]=nc; loop=true; }
        }
        /* 必ず使う数字が1マスにしか入らないなら確定 */
        for(v=1;v<=9;v++){
          m=1<<v;
          if(!(f.required&m)) continue;
          cnt=0; at=-1;
          for(k=0;k<rn.c.length;k++) if(cand[rn.c[k]]&m){ cnt++; at=rn.c[k]; }
          if(!cnt) return false;
          if(cnt===1&&cand[at]!==m){ cand[at]=m; loop=true; }
        }
      }
      for(j=0;j<NN;j++){                 /* 確定値を同じ枠の他マスから消す */
        if(block[j]||bc(cand[j])!==1) continue;
        m=cand[j];
        for(t=0;t<peers[j].length;t++){
          if(cand[peers[j][t]]&m){
            cand[peers[j][t]]&=~m;
            if(!cand[peers[j][t]]) return false;
            loop=true;
          }
        }
      }
    }

  }

  function rec(cand){
    if(over) return;
    if(++nodes>budget){ over=true; return; }
    if(!propagate(cand)) return;
    if(nodes===1){                       /* 最初の伝播で残った曖昧なマスを記録 */
      unresolved=[];
      for(var u=0;u<NN;u++) if(!block[u]&&bc(cand[u])>1) unresolved.push(u);
    }
    var best=-1,bestC=10,c,j;
    for(j=0;j<NN;j++){ if(block[j]) continue; c=bc(cand[j]); if(c>1&&c<bestC){bestC=c;best=j; if(c===2)break;} }
    if(best===-1){
      count++;
      if(want){ var g=new Array(NN).fill(0);
        for(j=0;j<NN;j++) if(!block[j]) g[j]=lowDigit(cand[j]);
        found.push(g); }
      return;
    }
    for(var v=1;v<=9;v++){
      if(!(cand[best]&(1<<v))) continue;
      var next=cand.slice();
      next[best]=1<<v;
      rec(next,best);
      if(count>=limit||over) return;
    }
  }

  var init=new Int16Array(NN);
  for(i=0;i<NN;i++) init[i]=block[i]?0:0x3FE;
  rec(init);
  KLAST.nodes=nodes;
  if(want) return {n:over?-1:count, sols:found, unresolved:unresolved||[]};
  return over?-1:count;
}
/* 仮置きなし（枝分かれ0回）で解けたか＝人間が理詰めでクリアできる盤面 */
function kakuroHumanSolves(n,block,runs){
  return kakuroSolve(n,block,runs,1,20000)===1 && KLAST.nodes===1;
}

/* 数字を入れ替えて「合計になりうる組み合わせの総数」を減らす山登り。
   例えば2マスで合計3なら{1,2}しかない、といった具合に枠を強く縛れるほど
   黒マスを増やさずに解が1通りに定まり、白マスの多い盤面になる。
   入れ替えの可否は「同じ枠に同じ数字が無いこと」だけで判定する。 */
function kakuroTighten(N,digit,block,rounds){
  var runs=kakuroRuns(N,block), i, k;
  var memberOf=[]; for(i=0;i<N*N;i++) memberOf.push([]);
  runs.forEach(function(rn,ix){ rn.c.forEach(function(x){ memberOf[x].push(ix); }); });
  function runScore(rn){
    var s=0,t; for(t=0;t<rn.c.length;t++) s+=digit[rn.c[t]];
    var lst=COMBO[rn.c.length+'_'+s];
    return lst?lst.length:9999;
  }
  var score=[], total=0;
  runs.forEach(function(rn,ix){ score[ix]=runScore(rn); total+=score[ix]; });
  var white=[]; for(i=0;i<N*N;i++) if(!block[i]) white.push(i);
  if(!white.length) return total;
  for(var it=0;it<rounds;it++){
    var cell=white[(Math.random()*white.length)|0], old=digit[cell], m=0, v;
    for(k=0;k<memberOf[cell].length;k++)
      runs[memberOf[cell][k]].c.forEach(function(x){ if(x!==cell) m|=1<<digit[x]; });
    var cands=[];
    for(v=1;v<=9;v++) if(v!==old&&!(m&(1<<v))) cands.push(v);
    if(!cands.length) continue;
    digit[cell]=cands[(Math.random()*cands.length)|0];
    var delta=0, aff=memberOf[cell];
    for(k=0;k<aff.length;k++) delta+=runScore(runs[aff[k]])-score[aff[k]];
    if(delta<=0){
      for(k=0;k<aff.length;k++) score[aff[k]]=runScore(runs[aff[k]]);
      total+=delta;
    } else digit[cell]=old;
  }
  return total;
}

/* 少しずつ進める生成器。
   土台（行・列で重複なし）を作って黒マスを撒き、解が複数なら食い違うマスを、
   一意でも理詰めで解けないなら未確定のマスを黒く塗って枠を短くする。
   黒マスを足すほど制約は強くなるので、これを繰り返せば必ず収束する。 */
function kakuroBuilder(inner,density,minRatio){
  var N=inner+1, tries=0, repairs=0, state=null;
  var minWhite=Math.round(inner*inner*(minRatio||0.30));
  function fresh(){
    var dg=distinctGrid(inner);
    if(!dg) return null;
    var digit=new Array(N*N).fill(0), block=new Array(N*N).fill(false), r,c;
    for(r=0;r<inner;r++) for(c=0;c<inner;c++) digit[(r+1)*N+(c+1)]=dg[r*inner+c];
    for(c=0;c<N;c++) block[c]=true;
    for(r=0;r<N;r++) block[r*N]=true;
    for(r=1;r<N;r++) for(c=1;c<N;c++) if(Math.random()<density) block[r*N+c]=true;
    if(!kakuroFixRuns(N,block)) return null;
    /* 枠を潰した結果、白マスが少なすぎる退化盤面になっていたら捨てる */
    var w=0; for(r=0;r<N*N;r++) if(!block[r]) w++;
    if(w<minWhite) return null;
    kakuroTighten(N,digit,block,4000);
    return {digit:digit, block:block};
  }
  function runsOf(st){
    var rs=kakuroRuns(N,st.block);
    rs.forEach(function(rn){ var s=0; rn.c.forEach(function(x){ s+=st.digit[x]; }); rn.s=s; });
    return rs;
  }
  return {
    label:function(){ return '盤面を厳選中… '+tries+'回目（調整'+repairs+'）'; },
    step:function(ms){
      var t0=Date.now();
      while(Date.now()-t0<ms){
        if(!state){ tries++; state=fresh(); if(!state) continue; }
        var runs=runsOf(state);
        var wNow=0,q; for(q=0;q<N*N;q++) if(!state.block[q]) wNow++;
        if(wNow<minWhite){ state=null; continue; }   /* 退化盤面は採用しない */
        var res=kakuroSolve(N,state.block,runs,2,8000,true);
        if(res.n===1&&res.unresolved.length===0){
          var hC=new Array(N*N).fill(0), vC=new Array(N*N).fill(0), white=0, j;
          runs.forEach(function(rn){
            var head=rn.c[0];
            if(rn.d==='h') hC[head-1]=rn.s; else vC[head-N]=rn.s;
          });
          for(j=0;j<N*N;j++) if(!state.block[j]) white++;
          var out={n:N, block:state.block, runs:runs, sol:state.digit,
                   hClue:hC, vClue:vC, tries:tries, repairs:repairs, white:white};
          state=null;
          return out;
        }
        var target=-1, i;
        if(res.n>=2&&res.sols.length>=2){          /* 解が食い違うマスを潰す */
          var diff=[];
          for(i=0;i<N*N;i++) if(!state.block[i]&&res.sols[0][i]!==res.sols[1][i]) diff.push(i);
          if(diff.length) target=diff[(Math.random()*diff.length)|0];
        }
        if(target<0&&res.unresolved.length)        /* 理詰めで決まらないマスを潰す */
          target=res.unresolved[(Math.random()*res.unresolved.length)|0];
        if(target<0){ state=null; continue; }
        state.block[target]=true; repairs++;
        if(!kakuroFixRuns(N,state.block)){ state=null; continue; }
        kakuroTighten(N,state.digit,state.block,600);   /* 枠が変わったので締め直す */
        var w=0; for(i=0;i<N*N;i++) if(!state.block[i]) w++;
        if(w<minWhite) state=null;                 /* 黒くなりすぎたら作り直し */
      }
      return null;
    }
  };
}

/* ===== 状態 ===== */
var S=null, sel=-1, memo=false;

/* 条件に合う手筋レベルの盤面が出るまで生成を繰り返す。
   UI を固めないよう 70ms ずつに刻み、時間切れなら一番近い盤面を採用する。 */
function newGame(d,onDone){
  var spec=DIFF[d], best=null, bestScore=1e9, tries=0, t0=Date.now();
  var lbl=document.getElementById('genLbl');
  function step(){
    var chunk=Date.now();
    while(Date.now()-chunk<70){
      tries++;
      var sol=generateFull(), puz=makePuzzle(sol,spec.c), g=humanSolve(puz);
      var lv=g.solved?g.lv:4;
      var score=(lv<spec.lo?spec.lo-lv:0)+(lv>spec.hi?lv-spec.hi:0);
      if(score<bestScore){ bestScore=score; best={sol:sol,puz:puz,lv:lv}; }
      if(!score||Date.now()-t0>GEN_BUDGET) break;
    }
    if(!bestScore||Date.now()-t0>GEN_BUDGET){ finish(); return; }
    if(lbl) lbl.textContent='盤面を厳選中… '+tries+'局目';
    setTimeout(step,0);
  }
  function finish(){
    var given=best.puz.map(function(v){return v!==0;});
    buildBoard(9,true,9);
    S={game:'n', n:9, dmax:9, diff:d, sol:best.sol, given:given, board:best.puz.slice(),
       notes:new Array(81).fill(0), undo:[], miss:0, done:false, lv:best.lv,
       cages: spec.cage ? buildCages(given,best.sol) : []};
    sel=-1; memo=false; save(); renderCages(); renderAll();
    if(onDone) onDone();
  }
  step();
}

/* キラーナンプレの開局。生成器を 70ms ずつ回して UI を止めない。 */

       board:new Array(81).fill(0), notes:new Array(81).fill(0),
       undo:[], miss:0, done:false, cages:r.cages};

/* 賢くなるパズルの開局。盤面サイズが変わるので DOM ごと組み直す。 */

function save(){ if(S){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} } }

/* ===== ルール判定 ===== */
var GROUPS=(function(){
  var gs=[],r,c,b,k,a;
  for(r=0;r<9;r++){a=[];for(c=0;c<9;c++)a.push(r*9+c);gs.push(a);}
  for(c=0;c<9;c++){a=[];for(r=0;r<9;r++)a.push(r*9+c);gs.push(a);}
  for(b=0;b<9;b++){a=[];for(k=0;k<9;k++)a.push((((b/3)|0)*3+((k/3)|0))*9+(b%3)*3+(k%3));gs.push(a);}
  return gs;
})();
/* 賢くなるパズルは任意サイズ・ブロック無しなので行と列だけを組にする */
function unitsOf(n,blocks){
  if(n===9&&blocks) return GROUPS;
  var gs=[],r,c,a;
  for(r=0;r<n;r++){a=[];for(c=0;c<n;c++)a.push(r*n+c);gs.push(a);}
  for(c=0;c<n;c++){a=[];for(r=0;r<n;r++)a.push(r*n+c);gs.push(a);}
  return gs;
}
function conflicts(){
  var n=S.n||9, bad={},gi,g,seen,k,i,v,vv;
  /* カックロ：枠ごとに「同じ数字の重複」と「合計」を見る。行・列全体の制約は無い */
  if(S.game==='q'){
    for(gi=0;gi<S.runs.length;gi++){
      var rn=S.runs[gi], sum=0, filled=0, dup={};
      for(k=0;k<rn.c.length;k++){
        v=S.board[rn.c[k]];
        if(!v) continue;
        filled++; sum+=v;
        (dup[v]=dup[v]||[]).push(rn.c[k]);
      }
      for(vv in dup) if(dup[vv].length>1) dup[vv].forEach(function(x){bad[x]=1;});
      if(sum>rn.s || (filled===rn.c.length&&sum!==rn.s))
        for(k=0;k<rn.c.length;k++) if(S.board[rn.c[k]]) bad[rn.c[k]]=1;
    }
    return bad;
  }
  var units=unitsOf(n, S.game!=='p');
  for(gi=0;gi<units.length;gi++){
    g=units[gi]; seen={};
    for(k=0;k<g.length;k++){ i=g[k]; v=S.board[i]; if(!v) continue; (seen[v]=seen[v]||[]).push(i); }
    for(vv in seen) if(seen[vv].length>1) seen[vv].forEach(function(x){bad[x]=1;});
  }
  /* 賢くなるパズル：枠の計算が合わなければ反則。枠内の数字の重複は反則ではない */
  if(S.game==='p'&&S.cages){
    for(gi=0;gi<S.cages.length;gi++){
      var pg=S.cages[gi], vals=[], nf=0;
      for(k=0;k<pg.c.length;k++){ v=S.board[pg.c[k]]; if(v){ vals.push(v); nf++; } }
      if(!nf) continue;
      var wrong=false;
      if(nf===pg.c.length) wrong = !opMatches(pg.op, pg.v, vals);
      else wrong = opOverrun(pg.op, pg.v, vals);
      if(wrong) for(k=0;k<pg.c.length;k++) if(S.board[pg.c[k]]) bad[pg.c[k]]=1;
    }
    return bad;
  }
  /* キラーはケージの規則も反則判定する：同じ数字の重複／合計超過／埋まったのに合計違い */
  if(S.game==='k'&&S.cages){
    for(gi=0;gi<S.cages.length;gi++){
      var cg=S.cages[gi], sum=0, filled=0, dup={};
      for(k=0;k<cg.c.length;k++){
        v=S.board[cg.c[k]];
        if(!v) continue;
        filled++; sum+=v;
        (dup[v]=dup[v]||[]).push(cg.c[k]);
      }
      for(vv in dup) if(dup[vv].length>1) dup[vv].forEach(function(x){bad[x]=1;});
      if(sum>cg.s || (filled===cg.c.length&&sum!==cg.s))
        for(k=0;k<cg.c.length;k++) if(S.board[cg.c[k]]) bad[cg.c[k]]=1;
    }
  }
  return bad;
}
function badCount(b){return Object.keys(b).length;}
function isComplete(){
  var NN=(S.n||9)*(S.n||9);
  for(var i=0;i<NN;i++){
    if(S.block&&S.block[i]) continue;        /* 黒マスは埋める対象外 */
    if(!S.board[i]) return false;
  }
  return badCount(conflicts())===0;
}
function dmaxOf(){ return S.dmax||S.n||9; }

/* ===== 入力 ===== */
function pushUndo(i){ S.undo.push({i:i, v:S.board[i], n:S.notes[i], miss:S.miss}); if(S.undo.length>400) S.undo.shift(); }
function place(n){
  if(!S||S.done||sel<0||S.given[sel]) return;
  if(S.block&&S.block[sel]) return;          /* 黒マスには入れられない */
  /* 使える数字の上限は盤面サイズとは別物。カックロは7×7でも1〜9を使う。 */
  if(n<1||n>dmaxOf()) return;
  if(memo){
    if(S.board[sel]) return;
    pushUndo(sel); S.notes[sel]^=(1<<n);
  }else{
    pushUndo(sel);
    if(S.board[sel]===n) S.board[sel]=0;
    else{
      S.board[sel]=n; S.notes[sel]=0;
      /* キラーは唯一解と照合してミス判定。{2,7}の入れ替えのように
         規則上は通ってしまう誤答も、その場で検出する */
      if(S.game==='k' ? n!==S.sol[sel] : conflicts()[sel]) S.miss++;
    }
  }
  after();
}
function erase(){
  if(!S||S.done||sel<0||S.given[sel]) return;
  if(!S.board[sel]&&!S.notes[sel]) return;
  pushUndo(sel); S.board[sel]=0; S.notes[sel]=0; after();
}
function undo(){
  if(!S||S.done||!S.undo.length) return;
  var u=S.undo.pop();
  S.board[u.i]=u.v; S.notes[u.i]=u.n; S.miss=u.miss; sel=u.i;
  renderAll(); save();
}
function after(){ renderAll(); save(); if(isComplete()) win(); }
function win(){
  S.done=true; save();
  document.getElementById('winDiff').textContent=
    (S.game==='k'?'キラー・':S.game==='p'?'賢くなる・':S.game==='q'?'カックロ・':'')+curDiffList()[S.diff].n;
  document.getElementById('winSub').textContent='ミス '+S.miss;
  var ov=document.getElementById('ovWin');
  ov.classList.remove('lit');
  ov.classList.add('show'); ov.classList.add('fxon');
  celebrate();
  /* 暗幕は少し遅らせて、まず盤面と花火を見せる */
  if(REDUCED) ov.classList.add('lit');
  else setTimeout(function(){ ov.classList.add('lit'); },600);
}

/* ===== 描画 ===== */
var boardEl=document.getElementById('board'), padEl=document.getElementById('pad');
/* 盤面サイズは可変（数独/キラー=9、賢くなるパズル=4〜7）。
   BOARD_N が現在DOMに組まれているサイズ、BOARD_BLOCKS は3×3ブロック罫線の有無。 */
var BOARD_N=0, BOARD_BLOCKS=true, cageSvg=null;
function baseCls(i){
  var n=BOARD_N, r=(i/n)|0, c=i%n, s='cell';
  if(BOARD_BLOCKS){
    if(c%3===2&&c!==n-1) s+=' br';
    if(r%3===2&&r!==n-1) s+=' bb';
  }
  if(c===n-1) s+=' lastc';
  if(r===n-1) s+=' lastr';
  return s;
}
function mkSvg(tag,attrs){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag),k;
  for(k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}
/* 盤面と数字パッドを組み直す。同じ構成なら何もしない。 */
/* pad=数字パッドのボタン数。カックロは盤面が11×11でも数字は1〜9なので分離する。 */
var PAD_N=0;
function buildBoard(n,blocks,pad){
  pad=pad||n;
  if(BOARD_N===n&&BOARD_BLOCKS===blocks&&PAD_N===pad) return;
  BOARD_N=n; BOARD_BLOCKS=blocks; PAD_N=pad;
  boardEl.innerHTML=''; padEl.innerHTML='';
  boardEl.style.setProperty('--n',n);
  boardEl.style.setProperty('--nc',n<=4?2:3);   /* メモの桁組み */
  padEl.style.setProperty('--pn',pad);
  var i,d,b;
  for(i=0;i<n*n;i++){
    d=document.createElement('div');
    d.className=baseCls(i);
    (function(k){
      d.addEventListener('pointerdown',function(){
        if(S&&S.block&&S.block[k]) return;       /* 黒マスは選べない */
        sel=k; renderAll();
      });
    })(i);
    boardEl.appendChild(d);
  }
  /* セルの“後ろ”に足す。children[0..n*n-1] はセルのままなので添字がずれない */
  cageSvg=mkSvg('svg',{id:'cages',viewBox:'0 0 '+(n*10)+' '+(n*10)});
  boardEl.appendChild(cageSvg);
  for(i=1;i<=pad;i++){
    b=document.createElement('button');
    b.className='num'; b.textContent=i; b.dataset.n=i;
    (function(v){ b.addEventListener('pointerdown',function(e){ e.preventDefault(); place(v); }); })(i);
    padEl.appendChild(b);
  }
}
buildBoard(9,true,9);

/* ケージの外周だけを点線で描く。隣が同じケージなら線を角まで伸ばして繋げる。 */
var CAGE_LABEL={};
function renderCages(){
  CAGE_LABEL={}; KAK_PEERS=null;
  while(cageSvg.firstChild) cageSvg.removeChild(cageSvg.firstChild);
  if(S&&S.game==='q'){ boardEl.classList.remove('haslabel'); renderKakuro(); return; }
  boardEl.classList.toggle('haslabel', !!(S&&S.cages&&S.cages.length));
  if(!S||!S.cages||!S.cages.length) return;
  var n=BOARD_N, U=10, pad=1.35, gi,cg,inC,k,i,r,c,x0,y0,x1,y1,L,R,T,B,txt;
  function line(a,b,cc,d){ cageSvg.appendChild(mkSvg('line',{x1:a,y1:b,x2:cc,y2:d})); }
  for(gi=0;gi<S.cages.length;gi++){
    cg=S.cages[gi]; inC={};
    for(k=0;k<cg.c.length;k++) inC[cg.c[k]]=1;
    for(k=0;k<cg.c.length;k++){
      i=cg.c[k]; r=(i/n)|0; c=i%n;
      x0=c*U; y0=r*U; x1=x0+U; y1=y0+U;
      L=(c>0&&inC[i-1]); R=(c<n-1&&inC[i+1]); T=(r>0&&inC[i-n]); B=(r<n-1&&inC[i+n]);
      if(!T) line(x0+(L?0:pad), y0+pad, x1-(R?0:pad), y0+pad);
      if(!B) line(x0+(L?0:pad), y1-pad, x1-(R?0:pad), y1-pad);
      if(!L) line(x0+pad, y0+(T?0:pad), x0+pad, y1-(B?0:pad));
      if(!R) line(x1-pad, y0+(T?0:pad), x1-pad, y1-(B?0:pad));
    }
    i=cg.c[0];                       /* 添字最小＝枠の左上のマス */
    CAGE_LABEL[i]=cageLabel(cg);
    r=(i/n)|0; c=i%n;
    txt=mkSvg('text',{x:c*U+pad+0.15, y:r*U+pad+1.55});
    txt.textContent=CAGE_LABEL[i];
    cageSvg.appendChild(txt);
    /* 「1296×」のような長いラベルがマスからはみ出さないよう、必要なときだけ詰める */
    var room=U-pad*2-0.3;
    if(txt.getComputedTextLength&&txt.getComputedTextLength()>room){
      txt.setAttribute('textLength',room);
      txt.setAttribute('lengthAdjust','spacingAndGlyphs');
    }
  }
}
/* カックロ：黒マスに対角線を引き、右上に横のヒント、左下に縦のヒントを置く。
   あわせて「同じ枠に属するマス」を作っておき、選択時の照らし出しに使う。 */
var KAK_PEERS=null;
function renderKakuro(){
  var n=S.n, U=10, i, r, c, t;
  KAK_PEERS=[];
  for(i=0;i<n*n;i++) KAK_PEERS.push(null);
  (S.runs||[]).forEach(function(rn){
    rn.c.forEach(function(x){
      if(!KAK_PEERS[x]) KAK_PEERS[x]={};
      rn.c.forEach(function(y){ KAK_PEERS[x][y]=1; });
    });
  });
  for(i=0;i<n*n;i++){
    if(!S.block[i]) continue;
    var h=S.hClue[i]||0, v=S.vClue[i]||0;
    if(!h&&!v) continue;
    r=(i/n)|0; c=i%n;
    cageSvg.appendChild(mkSvg('line',{x1:c*U, y1:r*U, x2:c*U+U, y2:r*U+U, 'class':'kdiag'}));
    if(h){
      t=mkSvg('text',{x:c*U+U-0.9, y:r*U+4.0, 'class':'kclue', 'text-anchor':'end'});
      t.textContent=h; cageSvg.appendChild(t);
    }
    if(v){
      t=mkSvg('text',{x:c*U+0.9, y:r*U+U-1.1, 'class':'kclue'});
      t.textContent=v; cageSvg.appendChild(t);
    }
  }
}

/* キラーは合計だけ、賢くなるパズルは「12×」のように演算子を添える */
var OPSYM={'+':'+','-':'−','*':'×','/':'÷','=':''};
function cageLabel(cg){ return cg.op ? (cg.v+OPSYM[cg.op]) : String(cg.s); }

function renderAll(){
  if(!S) return;
  var bad=conflicts();
  var n=S.n||9, NN=n*n, isQ=(S.game==='q'), blocks=(S.game!=='p'&&!isQ);
  /* キラーの赤表示は「答えと違うマス」。規則違反マークより正確で、
     正しい数字が他マスの誤りのとばっちりで赤くなることも無い */
  if(S.game==='k'&&S.sol){
    bad={};
    for(var bi=0;bi<NN;bi++) if(S.board[bi]&&S.board[bi]!==S.sol[bi]) bad[bi]=1;
  }
  var dmax=dmaxOf();
  var selV=sel>=0?S.board[sel]:0;
  var sr=sel>=0?((sel/n)|0):-1, sc=sel>=0?(sel%n):-1, sb=(sel>=0&&blocks)?boxOf(sel):-1;
  var cells=boardEl.children,i,el,v,cls,d,h;
  for(i=0;i<NN;i++){
    el=cells[i]; v=S.board[i]; cls=baseCls(i);
    if(isQ&&S.block[i]){                       /* 黒マスはヒント専用 */
      el.className=cls+' block'; el.textContent=''; continue;
    }
    if(sel>=0){
      if(isQ){ if(KAK_PEERS&&KAK_PEERS[sel]&&KAK_PEERS[sel][i]) cls+=' peer'; }
      /* 賢くなるパズルは3×3ブロックが無いので、行と列だけを照らす */
      else if(((i/n)|0)===sr||i%n===sc||(blocks&&boxOf(i)===sb)) cls+=' peer';
      if(selV&&v===selV) cls+=' same';
      if(i===sel) cls+=' sel';
    }
    if(v) cls+=S.given[i]?' given':' user';
    if(CAGE_LABEL[i]!==undefined) cls+=' hassum';
    if(bad[i]) cls+=' err';
    el.className=cls;
    if(v) el.textContent=v;
    else if(S.notes[i]){
      h='<div class="notes">';
      for(d=1;d<=dmax;d++) h+='<span>'+(((S.notes[i]>>d)&1)?d:'')+'</span>';
      el.innerHTML=h+'</div>';
    } else el.textContent='';
  }
  /* カックロは同じ数字が何度も出るので「使い切り」の薄表示はしない */
  if(isQ){ for(i=0;i<PAD_N;i++) padEl.children[i].classList.remove('done'); }
  else{
    var cnt=new Array(dmax+2).fill(0);
    for(i=0;i<NN;i++) if(S.board[i]) cnt[S.board[i]]++;
    for(i=0;i<PAD_N;i++) padEl.children[i].classList.toggle('done',cnt[i+1]>=n);
  }
  document.getElementById('diffLbl').textContent=
    (S.game==='k'?'キラー・':S.game==='p'?'賢くなる・':S.game==='q'?'カックロ・':'')+curDiffList()[S.diff].n;
  document.getElementById('missLbl').textContent=S.miss;
  var mb=document.getElementById('memoBtn');
  mb.classList.toggle('on',memo);
  mb.querySelector('.tag').textContent=memo?'ON':'OFF';
}

/* ===== クリア演出（花火・紙吹雪） =====
   #ovWin の中にキャンバスを敷き、暗幕とカードより後ろ・盤面より前で描く。 */
var FXC=['#ffd166','#ef476f','#06d6a0','#4cc9f0','#f78c6b','#c77dff','#ffe66d'];
var fxCv=null, fxG=null, fxP=[], fxQ=[], fxRaf=0, fxLast=0;
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function fxInit(){
  if(fxCv) return;
  fxCv=document.createElement('canvas'); fxCv.id='fx';
  var ov=document.getElementById('ovWin');
  ov.insertBefore(fxCv,ov.firstChild);
  fxG=fxCv.getContext('2d');
  addEventListener('resize',fxSize);
}
function fxSize(){
  if(!fxCv) return;
  var d=Math.min(2, window.devicePixelRatio||1);   /* 高DPR端末で描画量が爆発しないよう上限 */
  fxCv.width=Math.round(innerWidth*d); fxCv.height=Math.round(innerHeight*d);
  fxG.setTransform(d,0,0,d,0,0);
}
function fxColor(){ return FXC[(Math.random()*FXC.length)|0]; }

function fxBurst(x,y){                       /* 花火：一点から放射状に */
  var n=48, col=fxColor(), i,a,sp;
  for(i=0;i<n;i++){
    a=Math.PI*2*i/n + Math.random()*0.14;
    sp=95+Math.random()*175;
    fxP.push({t:'s', x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:115,
              life:0.85+Math.random()*0.75, max:1.6, drag:0.982,
              col:Math.random()<0.22?'#ffffff':col, sz:1.7+Math.random()*1.7});
  }
}
function fxRain(n){                          /* 紙吹雪：上から降らせる */
  for(var i=0;i<n;i++)
    fxP.push({t:'c', x:Math.random()*innerWidth, y:-24-Math.random()*innerHeight*0.6,
              vx:(Math.random()-0.5)*70, vy:70+Math.random()*95, g:55,
              life:3.4+Math.random()*2.4, max:5.8, drag:1, col:fxColor(),
              w:5+Math.random()*5, h:8+Math.random()*7,
              rot:Math.random()*6.28, vrot:(Math.random()-0.5)*10});
}
function fxCannon(dir){                      /* クラッカー：画面下の左右から噴き上げ */
  var x = dir>0 ? -12 : innerWidth+12;
  for(var i=0;i<46;i++)
    fxP.push({t:'c', x:x, y:innerHeight*0.9,
              vx:dir*(270+Math.random()*430), vy:-(370+Math.random()*390), g:640,
              life:2.4+Math.random()*1.7, max:4.1, drag:0.993, col:fxColor(),
              w:5+Math.random()*5, h:8+Math.random()*7,
              rot:Math.random()*6.28, vrot:(Math.random()-0.5)*15});
}

function fxLoop(now){
  var dt=Math.min(48, now-fxLast)/1000; fxLast=now;
  fxG.clearRect(0,0,innerWidth,innerHeight);
  while(fxQ.length && fxQ[0].at<=now){ var b=fxQ.shift(); b.run(); }
  for(var i=fxP.length-1;i>=0;i--){
    var p=fxP[i];
    p.life-=dt;
    if(p.life<=0 || p.y>innerHeight+60){ fxP.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.drag!==1){ p.vx*=p.drag; p.vy*=p.drag; }
    var al=Math.min(1, p.life/(p.max*0.42));
    fxG.globalAlpha=al;
    if(p.t==='s'){
      fxG.strokeStyle=p.col; fxG.lineWidth=p.sz; fxG.lineCap='round';
      fxG.beginPath();
      fxG.moveTo(p.x-p.vx*0.022, p.y-p.vy*0.022);
      fxG.lineTo(p.x,p.y);
      fxG.stroke();
    }else{
      p.rot+=p.vrot*dt;
      fxG.save(); fxG.translate(p.x,p.y); fxG.rotate(p.rot);
      fxG.fillStyle=p.col;
      fxG.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.rot*1.7)));  /* ひらひら */
      fxG.restore();
    }
  }
  fxG.globalAlpha=1;
  if(fxP.length||fxQ.length) fxRaf=requestAnimationFrame(fxLoop);
  else { fxRaf=0; fxG.clearRect(0,0,innerWidth,innerHeight); }
}
function fxStop(){
  if(fxRaf){ cancelAnimationFrame(fxRaf); fxRaf=0; }
  fxP=[]; fxQ=[];
  if(fxG) fxG.clearRect(0,0,innerWidth,innerHeight);
  var cells=boardEl.children;
  for(var i=0;i<cells.length;i++) if(cells[i].style) cells[i].style.animation='';
  boardEl.classList.remove('win');
}

/* 盤面のウェーブ → クラッカー → 花火と紙吹雪 */
function celebrate(){
  if(REDUCED) return;
  fxInit(); fxSize(); fxStop();
  var cells=boardEl.children, n=BOARD_N, NN=n*n, i;
  var stagger=0.042*9/n;                       /* 盤面が小さくても波の長さを揃える */
  for(i=0;i<NN;i++)
    cells[i].style.animation='cellPop .5s ease-out '+(((i/n|0)+(i%n))*stagger).toFixed(3)+'s both';
  boardEl.classList.add('win');
  /* 1.8秒後に盤面が別サイズへ組み直されている可能性があるので、
     その時点の子要素を数え直す（古いマス数を使うと undefined を触って落ちる） */
  setTimeout(function(){
    var cur=boardEl.children;
    for(var k=0;k<cur.length;k++) if(cur[k].style) cur[k].style.animation='';
  },1800);

  var t0=performance.now();
  function at(ms,fn){ fxQ.push({at:t0+ms, run:fn}); }
  at(240,function(){ fxCannon(1); fxCannon(-1); });
  at(300,function(){ fxRain(70); });
  at(1000,function(){ fxRain(55); });
  [520,980,1460,2050,2700,3350].forEach(function(ms){
    at(ms,function(){
      fxBurst(innerWidth*(0.16+Math.random()*0.68), innerHeight*(0.14+Math.random()*0.4));
    });
  });
  fxQ.sort(function(a,b){return a.at-b.at;});
  fxLast=performance.now();
  fxRaf=requestAnimationFrame(fxLoop);
}

/* アプリを離れるタイミングでも保険で保存（通常は入力のたびに保存済み） */
document.addEventListener('visibilitychange',function(){ if(document.hidden) save(); });

/* ===== UI ===== */
document.getElementById('memoBtn').addEventListener('click',function(){memo=!memo;renderAll();});
document.getElementById('eraseBtn').addEventListener('click',erase);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('newBtn').addEventListener('click',function(){document.getElementById('ovNew').classList.add('show');});
document.getElementById('cancelNew').addEventListener('click',function(){document.getElementById('ovNew').classList.remove('show');});
document.getElementById('againBtn').addEventListener('click',function(){
  var ov=document.getElementById('ovWin');
  fxStop();
  ov.classList.remove('show'); ov.classList.remove('fxon'); ov.classList.remove('lit');
  document.getElementById('ovNew').classList.add('show');
});
var pickGame='n';
var GAME_DESC={
  n:'答えは必ず1通り。解くのに必要な手筋を判定して盤面を選んでいます。',
  k:'ヒント数字なし。点線のケージ内の合計だけが手がかりで、ケージ内に同じ数字は入りません。答えと違う数字はその場で赤くなります。',
  p:'3×3ブロックは無く、各行・各列に1〜nを1回ずつ。枠の数字は「12×」なら中身をかけて12。枠の中は同じ数字が入ってもかまいません。',
  q:'黒マスの数字が、その右または下に続く白マスの合計。ひとつながりの白マスに同じ数字は入りません（1〜9）。'
};
function buildDiffList(){
  var dl=document.getElementById('diffList');
  dl.innerHTML='';
  document.getElementById('gameDesc').textContent=GAME_DESC[pickGame];
  (pickGame==='k'?KDIFF:pickGame==='p'?PDIFF:pickGame==='q'?QDIFF:DIFF).forEach(function(spec,d){
    var b=document.createElement('button');
    b.className='dbtn';
    b.innerHTML=spec.n+'<small>'+spec.d+'</small>';
    b.addEventListener('click',function(){
      var g=pickGame;
      document.getElementById('ovNew').classList.remove('show');
      document.getElementById('genLbl').textContent='盤面を厳選中…';
      document.getElementById('ovGen').classList.add('show');
      setTimeout(function(){
        var done=function(){ document.getElementById('ovGen').classList.remove('show'); };
        if(g==='k') newKiller(d,done);
        else if(g==='p') newKenKen(d,done);
        else if(g==='q') newKakuro(d,done);
        else newGame(d,done);
      },30);
    });
    dl.appendChild(b);
  });
}
Array.prototype.forEach.call(document.querySelectorAll('.gtab'),function(t){
  t.addEventListener('click',function(){
    pickGame=t.dataset.g;
    Array.prototype.forEach.call(document.querySelectorAll('.gtab'),function(x){
      x.classList.toggle('on',x.dataset.g===pickGame);
    });
    buildDiffList();
  });
});
buildDiffList();
document.addEventListener('keydown',function(e){
  if(!S) return;
  if(e.key>='1'&&e.key<='9'&&+e.key<=dmaxOf()){place(+e.key);e.preventDefault();return;}
  if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){erase();e.preventDefault();return;}
  if(e.key==='n'||e.key==='N'){memo=!memo;renderAll();return;}
  if((e.key==='z'||e.key==='Z')&&(e.metaKey||e.ctrlKey)){undo();e.preventDefault();return;}
  var n=S.n||9, map={ArrowLeft:-1,ArrowRight:1,ArrowUp:-n,ArrowDown:n};
  if(map[e.key]!==undefined&&sel>=0){
    var t=sel+map[e.key], r=(sel/n)|0;
    if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&((t/n)|0)!==r) t=sel;
    if(t>=0&&t<n*n){sel=t;renderAll();}
    e.preventDefault();
  }
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ===== 起動 ===== */
if(load()){
  pickGame=S.game;
  Array.prototype.forEach.call(document.querySelectorAll('.gtab'),function(x){
    x.classList.toggle('on',x.dataset.g===pickGame);
  });
  buildDiffList();
  renderCages(); renderAll();
  if(S.done) document.getElementById('ovNew').classList.add('show');
}else{
  document.getElementById('ovNew').classList.add('show');
}
</script>
